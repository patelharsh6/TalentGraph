name: talentgraph

x-app: &app
  build: .
  image: talentgraph:dev
  env_file: .env
  volumes:
    - uploads:/app/uploads
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    chroma:
      condition: service_started

services:
  api:
    <<: *app
    command: sh -c "alembic upgrade head && uvicorn talentgraph.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *app
    command: celery -A talentgraph.worker.celery_app worker -Q parse,webhooks -l info
    healthcheck:
      test: ["CMD-SHELL", "celery -A talentgraph.worker.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  flower:
    <<: *app
    profiles: ["tools"]
    command: celery -A talentgraph.worker.celery_app flower --port=5555
    ports:
      - "5555:5555"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: talentgraph
      POSTGRES_PASSWORD: talentgraph
      POSTGRES_DB: talentgraph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentgraph"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:1.5.9  # keep in step with the chromadb-client version in uv.lock
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/data

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

volumes:
  pgdata:
  chromadata:
  uploads:
