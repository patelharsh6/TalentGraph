name: talentgraph

services:
  api:
    build: .
    image: talentgraph:dev
    env_file: .env
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn talentgraph.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: talentgraph
      POSTGRES_PASSWORD: talentgraph
      POSTGRES_DB: talentgraph
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentgraph"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:1.5.9  # keep in step with the chromadb-client version in uv.lock
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000 && printf \"GET /api/v2/heartbeat HTTP/1.0\r\n\r\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Dev toolchain in Linux, for machines whose Windows Application Control policy blocks native
  # wheels (torch, PyMuPDF) and the uv-installed launchers (pytest.exe, mypy.exe). Not started by
  # `docker compose up`; use: docker compose run --rm tools uv run pytest
  tools:
    profiles: ["tools"]
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    # No env_file: Settings reads /work/.env itself, and exported variables would leak into tests.
    environment:
      UV_PROJECT_ENVIRONMENT: /venv  # keeps the host's Windows .venv untouched
      UV_LINK_MODE: copy
      UV_CACHE_DIR: /uv-cache
    working_dir: /work
    volumes:
      - .:/work
      - tools-venv:/venv
      - uv-cache:/uv-cache
    entrypoint: ["sh", "-c", "uv sync --frozen --quiet && exec \"$$@\"", "--"]

volumes:
  pgdata:
  chromadata:
  uploads:
  tools-venv:
  uv-cache:
