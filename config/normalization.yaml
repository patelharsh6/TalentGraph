# Normalization cascade thresholds (plan §6.2). Tuned in Step 3.9 on val split.
fuzzy:
  min_score: 88          # rapidfuzz token_sort_ratio (tuned from 92 to 88 on val)
  require_unique_top: true
embedding:
  min_cosine: 0.82
  min_margin: 0.05
  top_k: 5
llm:
  min_confidence: 0.7
emerging:
  review_ready_occurrences: 3
  max_example_contexts: 5
