[project]
name = "talentgraph"
version = "0.1.0"
description = "Multi-agent resume parsing, skill normalization and semantic job matching with a REST API."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    # Storage / cache
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "chromadb-client>=0.5",
    # Agents / ML
    "langgraph>=0.2",
    "google-genai>=1.0",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "numpy>=1.26",
    "rapidfuzz>=3.9",
    # Parsing
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "dateparser>=1.2",
    "phonenumbers>=8.13",
    # Infra
    "tenacity>=8.5",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11,<2",  # mypy 2.x native parser DLL is blocked by Windows Application Control here
    "types-pyyaml",
    "types-dateparser",
    "pre-commit>=3.8",
    "locust>=2.31",
    "faker>=28.0",
    "reportlab>=4.2",
    "openapi-spec-validator>=0.7",
    "scipy>=1.14",
    "scikit-learn>=1.5",  # eval metrics (NDCG)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talentgraph"]

# CPU-only PyTorch wheels on Linux (Docker) keep the image small; Windows/macOS PyPI wheels are CPU already.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["talentgraph"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "sentence_transformers.*",
    "fitz.*",
    "pymupdf.*",
    "docx.*",
    "phonenumbers.*",
    "sklearn.*",
]
ignore_missing_imports = true

# PyMuPDF's partial inline hints fail strict mode (untyped calls, Document not iterable); treat it
# as untyped.
[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tests import the eval harness (eval/)
asyncio_mode = "auto"
addopts = "-m 'not integration and not e2e and not llm and not slow'"
markers = [
    "unit: fast, offline tests (default)",
    "integration: needs docker compose services",
    "e2e: full API flows against the compose stack",
    "llm: calls the real Gemini API (uses free-tier quota)",
    "slow: long-running tests",
]

[tool.coverage.run]
source = ["src/talentgraph"]
